services:
  mongo:
    image: mongo:7
    container_name: poi-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - poi-mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  importer:
    build:
      context: ./script
    container_name: poi-importer
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/poi

volumes:
  poi-mongo-data:
