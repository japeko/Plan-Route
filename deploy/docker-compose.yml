services:
  traefik:
    image: traefik:v3.2
    container_name: poi-traefik
    environment:
      # Traefik's embedded Docker client otherwise falls back to API 1.24,
      # which recent Docker Engine versions on the host refuse to serve
      # ("client version 1.24 is too old. Minimum supported API version is
      # 1.40") — pin a version comfortably above that floor instead.
      DOCKER_API_VERSION: "1.41"
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.web.http.redirections.entrypoint.to=websecure
      - --entrypoints.web.http.redirections.entrypoint.scheme=https
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.tlschallenge=true
      - --certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - letsencrypt:/letsencrypt
    restart: unless-stopped

  mongo:
    image: mongo:7
    container_name: poi-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  mongo-express:
    image: mongo-express:1.0.2
    container_name: poi-mongo-express
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USERNAME}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD}
      ME_CONFIG_SITE_BASEURL: /db/
    labels:
      - traefik.enable=true
      - traefik.http.routers.mongo-express.rule=Host(`${DOMAIN}`) && PathPrefix(`/db`)
      - traefik.http.routers.mongo-express.entrypoints=websecure
      - traefik.http.routers.mongo-express.tls.certresolver=letsencrypt
      - traefik.http.services.mongo-express.loadbalancer.server.port=8081
    restart: unless-stopped

  client:
    image: ghcr.io/${GITHUB_OWNER}/poi-client:${IMAGE_TAG:-latest}
    container_name: poi-client
    environment:
      PREVIEW_ALLOWED_HOST: ${DOMAIN}
    labels:
      - traefik.enable=true
      - traefik.http.routers.client.rule=Host(`${DOMAIN}`)
      - traefik.http.routers.client.entrypoints=websecure
      - traefik.http.routers.client.tls.certresolver=letsencrypt
      - traefik.http.services.client.loadbalancer.server.port=4173
    restart: unless-stopped

  server:
    image: ghcr.io/${GITHUB_OWNER}/poi-server:${IMAGE_TAG:-latest}
    container_name: poi-server
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@mongo:27017/poi?authSource=admin
      PORT: "3000"
      CLIENT_ORIGIN: https://${DOMAIN}
    labels:
      - traefik.enable=true
      # More specific than the client's plain Host rule, so /api requests
      # go here and everything else goes to the client.
      - traefik.http.routers.server.rule=Host(`${DOMAIN}`) && PathPrefix(`/api`)
      - traefik.http.routers.server.entrypoints=websecure
      - traefik.http.routers.server.tls.certresolver=letsencrypt
      - traefik.http.services.server.loadbalancer.server.port=3000
    restart: unless-stopped

volumes:
  letsencrypt:
  mongo-data:
